name: mac-cork-repro
on:
  push:
    branches: [ci-mac-cork-repro]
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15,       tag: macos-arm64}
          - {os: macos-15,       tag: macos-arm64-rosetta-x86bins, x86bins: true}
          - {os: macos-15-intel, tag: macos-x86_64}
          - {os: ubuntu-latest,  tag: linux-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get iso2mesh (same commit as local test)
        run: |
          git clone -q https://github.com/fangq/iso2mesh.git
          git -C iso2mesh checkout -q 4a0ca5b
      - name: Swap in Intel binaries (run under Rosetta)
        if: matrix.x86bins
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          cd iso2mesh/bin
          for b in cork tetgen tetgen1.5 meshfix; do cp $b.mexmaci64 $b.mexmaca64; done
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - uses: matlab-actions/run-command@v2
        with:
          command: cork_repro('${{ matrix.tag }}')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.tag }}
          path: results/

  collect:
    needs: repro
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Commit results to ci-mac-cork-repro-results
        run: |
          mkdir -p out
          for d in artifacts/*/; do cp -r "$d"* out/ 2>/dev/null || true; done
          cat out/*/summary.txt > out/ALL_SUMMARIES.txt 2>/dev/null || echo "no summaries" > out/ALL_SUMMARIES.txt
          cd out
          git init -q -b ci-mac-cork-repro-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Results of run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-mac-cork-repro-results
